  <style><![CDATA[
    .ink { color: #304f61; }

    .eye-layer {
      transform-box: fill-box;
      transform-origin: center;
    }

    .neutral-eyes { animation: neutral-eyes 5.2s linear infinite; }
    .happy-eyes { opacity: 0; animation: happy-eyes 5.2s linear infinite; }

    @keyframes neutral-eyes {
      0%, 23.08% { opacity: 1; transform: scaleY(1); }
      24.81%, 25.77% { opacity: 1; transform: scaleY(0.06); }
      27.50%, 56.73% { opacity: 1; transform: scaleY(1); }
      59.22% { opacity: 1; transform: scaleY(0.06); }
      59.23%, 80.37% { opacity: 0; transform: scaleY(0.06); }
      80.38% { opacity: 1; transform: scaleY(0.06); }
      82.88%, 100% { opacity: 1; transform: scaleY(1); }
    }

    @keyframes happy-eyes {
      0%, 59.22% { opacity: 0; transform: scaleY(0.06); }
      59.23% { opacity: 1; transform: scaleY(0.06); }
      61.73%, 77.88% { opacity: 1; transform: scaleY(1); }
      80.38% { opacity: 1; transform: scaleY(0.06); }
      80.39%, 100% { opacity: 0; transform: scaleY(0.06); }
    }

    @media (prefers-color-scheme: dark) {
      .ink { color: #eceae4; }
    }

    @media (prefers-reduced-motion: reduce) {
      .neutral-eyes { animation: none; opacity: 1; transform: none; }
      .happy-eyes { animation: none; display: none; }
    }
  ]]></style>

